<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Website of Arnav Gupta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0714;
    --violet: #2b0f5c;
    --magenta: #ff2e93;
    --cyan: #19f0ff;
    --ink: #eaf6ff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,46,147,.28), transparent 50%),
      radial-gradient(ellipse at 85% 85%, rgba(25,240,255,.22), transparent 50%),
      linear-gradient(160deg, var(--violet), var(--void) 65%);
    background-attachment: fixed;
    overflow-x: hidden;
    position: relative;
  }
  /* retro perspective grid floor */
  body::before {
    content: "";
    position: fixed;
    left: -50%; right: -50%; bottom: 0;
    height: 55vh;
    background-image:
      linear-gradient(var(--cyan) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
    background-size: 56px 56px;
    transform: perspective(380px) rotateX(62deg);
    transform-origin: bottom;
    opacity: .28;
    animation: scroll 2.4s linear infinite;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent);
            mask-image: linear-gradient(to top, #000 30%, transparent);
  }
  @keyframes scroll { to { background-position: 0 56px; } }
  /* scanlines */
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.5rem, 5vw, 3rem);
    padding: 2rem 1.25rem;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-family: "Orbitron", "Arial Black", sans-serif;
    font-weight: 900;
    font-size: clamp(1.9rem, 7vw, 4.5rem);
    line-height: 1.1;
    letter-spacing: .02em;
    max-width: 18ch;
    color: #fff;
    text-shadow: 3px 0 var(--magenta), -3px 0 var(--cyan), 0 0 28px rgba(25,240,255,.55);
  }
  .coming {
    font-family: "Orbitron", sans-serif;
    font-weight: 600;
    font-size: clamp(1rem, 3.2vw, 1.6rem);
    padding: .8em 1.4em;
    border: 2px solid var(--cyan);
    border-radius: 6px;
    background: rgba(10,7,20,.6);
    box-shadow: 0 0 18px rgba(25,240,255,.45), inset 0 0 14px rgba(25,240,255,.18);
    animation: blink 2.2s ease-in-out infinite;
  }
  @keyframes blink { 50% { box-shadow: 0 0 30px rgba(255,46,147,.7), inset 0 0 14px rgba(255,46,147,.25); border-color: var(--magenta); } }
  .pi-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: clamp(130px, 40vw, 240px);
    aspect-ratio: 4 / 3;
    padding: .5rem;
    color: var(--cyan);
    text-decoration: none;
    font-family: "Orbitron", sans-serif;
    font-weight: 900;
    line-height: 1;
    border: 2px solid var(--magenta);
    border-radius: 8px;
    background: rgba(10,7,20,.6);
    box-shadow: 0 0 16px rgba(255,46,147,.45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .pi-box:hover, .pi-box:focus-visible {
    transform: scale(1.05);
    box-shadow: 0 0 28px rgba(255,46,147,.8);
    outline: none;
  }
  .pi-box span { display: inline-block; }
  .games {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
  }
  .bird-box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .3rem;
    width: clamp(130px, 40vw, 240px);
    aspect-ratio: 4 / 3;
    padding: .5rem;
    color: var(--cyan);
    text-decoration: none;
    font-family: "Orbitron", sans-serif;
    font-weight: 600;
    font-size: clamp(.75rem, 2.4vw, .95rem);
    border: 2px solid var(--cyan);
    border-radius: 8px;
    background: rgba(10,7,20,.6);
    box-shadow: 0 0 16px rgba(25,240,255,.45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .bird-box svg { flex: 1 1 auto; min-height: 0; width: 100%; height: auto; display: block; }
  .bird-box:hover, .bird-box:focus-visible {
    transform: scale(1.05);
    box-shadow: 0 0 28px rgba(25,240,255,.85);
    outline: none;
  }
  footer {
    position: relative;
    z-index: 1;
    padding: 1.1rem 1rem calc(1.1rem + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 1.15rem;
    font-weight: 600;
    background: rgba(10,7,20,.75);
    border-top: 1px solid rgba(25,240,255,.4);
  }
  @media (prefers-reduced-motion: reduce) {
    body::before, .coming { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>The Website of Arnav Gupta</h1>
    <div class="games">
      <a class="pi-box" id="pi" href="Pi%20Calculator.html" aria-label="Open Pi Calculator">3.1415.....</a>
      <a class="bird-box" href="GAME-SECTION.html" aria-label="Open Game Section">
        <svg viewBox="0 0 130 90" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M30 18 H100 Q124 18 124 48 Q124 76 106 76 Q94 76 88 64 H42 Q36 76 24 76 Q6 76 6 48 Q6 18 30 18 Z" fill="#19f0ff" opacity=".9"/>
          <rect x="24" y="44" width="30" height="8" rx="2" fill="#0a0714"/>
          <rect x="35" y="33" width="8" height="30" rx="2" fill="#0a0714"/>
          <circle cx="90" cy="38" r="6" fill="#ff2e93"/>
          <circle cx="104" cy="52" r="6" fill="#ff2e93"/>
        </svg>
        GAME SECTION
      </a>
    </div>
    <p class="coming">More content about to come</p>
  </main>
  <script>
    // Shrink each character a little more than the one before it
    (function () {
      var el = document.getElementById("pi");
      var text = el.textContent;
      el.textContent = "";
      for (var i = 0; i < text.length; i++) {
        var s = document.createElement("span");
        s.textContent = text[i];
        s.style.fontSize = "calc(clamp(1.8rem, 8vw, 3.6rem) * " + Math.max(0.2, 1 - i * 0.09).toFixed(2) + ")";
        el.appendChild(s);
      }
    })();
  </script>
  <footer>&copy; OP_Gamer_hai</footer>
</body>
</html>
