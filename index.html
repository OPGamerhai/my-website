<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Website of Arnav Gupta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0714;
    --violet: #2b0f5c;
    --magenta: #ff2e93;
    --cyan: #19f0ff;
    --ink: #eaf6ff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,46,147,.28), transparent 50%),
      radial-gradient(ellipse at 85% 85%, rgba(25,240,255,.22), transparent 50%),
      linear-gradient(160deg, var(--violet), var(--void) 65%);
    background-attachment: fixed;
    overflow-x: hidden;
    position: relative;
  }
  /* retro perspective grid floor */
  body::before {
    content: "";
    position: fixed;
    left: -50%; right: -50%; bottom: 0;
    height: 55vh;
    background-image:
      linear-gradient(var(--cyan) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
    background-size: 56px 56px;
    transform: perspective(380px) rotateX(62deg);
    transform-origin: bottom;
    opacity: .28;
    animation: scroll 2.4s linear infinite;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent);
            mask-image: linear-gradient(to top, #000 30%, transparent);
  }
  @keyframes scroll { to { background-position: 0 56px; } }
  /* scanlines */
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.5rem, 5vw, 3rem);
    padding: 2rem 1.25rem;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-family: "Orbitron", "Arial Black", sans-serif;
    font-weight: 900;
    font-size: clamp(1.9rem, 7vw, 4.5rem);
    line-height: 1.1;
    letter-spacing: .02em;
    max-width: 18ch;
    color: #fff;
    text-shadow: 3px 0 var(--magenta), -3px 0 var(--cyan), 0 0 28px rgba(25,240,255,.55);
  }
  .coming {
    font-family: "Orbitron", sans-serif;
    font-weight: 600;
    font-size: clamp(1rem, 3.2vw, 1.6rem);
    padding: .8em 1.4em;
    border: 2px solid var(--cyan);
    border-radius: 6px;
    background: rgba(10,7,20,.6);
    box-shadow: 0 0 18px rgba(25,240,255,.45), inset 0 0 14px rgba(25,240,255,.18);
    animation: blink 2.2s ease-in-out infinite;
  }
  @keyframes blink { 50% { box-shadow: 0 0 30px rgba(255,46,147,.7), inset 0 0 14px rgba(255,46,147,.25); border-color: var(--magenta); } }
  .pi-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: clamp(130px, 40vw, 240px);
    aspect-ratio: 4 / 3;
    padding: .5rem;
    color: var(--cyan);
    text-decoration: none;
    font-family: "Orbitron", sans-serif;
    font-weight: 900;
    line-height: 1;
    border: 2px solid var(--magenta);
    border-radius: 8px;
    background: rgba(10,7,20,.6);
    box-shadow: 0 0 16px rgba(255,46,147,.45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .pi-box:hover, .pi-box:focus-visible {
    transform: scale(1.05);
    box-shadow: 0 0 28px rgba(255,46,147,.8);
    outline: none;
  }
  .pi-box span { display: inline-block; }
  .games {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
  }
  .bird-box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .3rem;
    width: clamp(130px, 40vw, 240px);
    aspect-ratio: 4 / 3;
    padding: .5rem;
    color: var(--cyan);
    text-decoration: none;
    font-family: "Orbitron", sans-serif;
    font-weight: 600;
    font-size: clamp(.75rem, 2.4vw, .95rem);
    border: 2px solid var(--cyan);
    border-radius: 8px;
    background: rgba(10,7,20,.6);
    box-shadow: 0 0 16px rgba(25,240,255,.45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .bird-box svg { flex: 1 1 auto; min-height: 0; width: 100%; height: auto; display: block; }
  .bird-box:hover, .bird-box:focus-visible {
    transform: scale(1.05);
    box-shadow: 0 0 28px rgba(25,240,255,.85);
    outline: none;
  }
  footer {
    position: relative;
    z-index: 1;
    padding: 1.1rem 1rem calc(1.1rem + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 1.15rem;
    font-weight: 600;
    background: rgba(10,7,20,.75);
    border-top: 1px solid rgba(25,240,255,.4);
  }
  @media (prefers-reduced-motion: reduce) {
    body::before, .coming { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>The Website of Arnav Gupta</h1>
    <div class="games">
      <a class="pi-box" id="pi" href="Pi%20Calculator.html" aria-label="Open Pi Calculator">3.1415.....</a>
      <a class="bird-box" href="whirly-bird.html" aria-label="Play Whirly Bird">
        <svg viewBox="0 0 130 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- platform -->
          <rect x="6" y="82" width="118" height="22" rx="11" fill="#1f6b2e"/>
          <rect x="6" y="80" width="118" height="19" rx="9.5" fill="#3fae4f"/>
          <rect x="14" y="83" width="102" height="4" rx="2" fill="#6fd47c" opacity=".7"/>
          <!-- body -->
          <circle cx="62" cy="58" r="27" fill="#f9b21d"/>
          <ellipse cx="50" cy="66" rx="14" ry="11" fill="#f28c1e"/>
          <!-- beak -->
          <path d="M87 57 L106 63 L87 69 Z" fill="#e8465a" stroke="#e8465a" stroke-width="2" stroke-linejoin="round"/>
          <!-- eye -->
          <circle cx="76" cy="52" r="8" fill="#fff"/>
          <circle cx="78.5" cy="52" r="3.6" fill="#1b1b1b"/>
          <!-- propeller hat -->
          <path d="M42 40 Q62 16 82 38 Q62 32 42 40 Z" fill="#1f8a96"/>
          <rect x="60" y="22" width="4" height="8" fill="#176f79"/>
          <ellipse cx="52" cy="21" rx="10" ry="3" fill="#f6a23a"/>
          <ellipse cx="72" cy="21" rx="10" ry="3" fill="#f6a23a"/>
          <circle cx="62" cy="21" r="3" fill="#176f79"/>
        </svg>
        Whirly Bird
      </a>
    </div>
    <p class="coming">More games about to come</p>
  </main>
  <script>
    // Shrink each character a little more than the one before it
    (function () {
      var el = document.getElementById("pi");
      var text = el.textContent;
      el.textContent = "";
      for (var i = 0; i < text.length; i++) {
        var s = document.createElement("span");
        s.textContent = text[i];
        s.style.fontSize = "calc(clamp(1.8rem, 8vw, 3.6rem) * " + Math.max(0.2, 1 - i * 0.09).toFixed(2) + ")";
        el.appendChild(s);
      }
    })();
  </script>
  <footer>&copy; OP_Gamer_hai</footer>
</body>
</html>
